[package]
name = "card-captor"
version = "0.1.0"
description = "A roaming desktop companion carrying a Notion card feed"
edition = "2021"
rust-version = "1.88"

[lib]
name = "card_captor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
measurement = []
character-validation = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2.4"
json-patch = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
url = "2"
chrono = { version = "0.4", features = ["clock", "serde"] }
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "sync", "net", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
keyring = { version = "4.2.0", features = ["v1"] }
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
